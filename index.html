<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كيان نيوز | KAYAN NEWS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>كيان نيوز</h1>
      <span>KAYAN NEWS</span>
    </div>
    <button id="toggleAdminBtn" class="btn-admin">لوحة الإدارة</button>
  </header>

  <div class="ticker">
    <span class="ticker-badge">عاجل</span>
    <marquee id="breakingTicker" behavior="scroll" direction="right">مرحباً بكم في منصة كيان نيوز الإخبارية</marquee>
  </div>

  <nav class="categories" id="categoryNav">
    <button data-cat="الكل" class="active">الكل</button>
    <button data-cat="محلية">محلية</button>
    <button data-cat="عربية">عربية</button>
    <button data-cat="دولية">دولية</button>
    <button data-cat="سياسة">سياسة</button>
    <button data-cat="رياضة">رياضة</button>
    <button data-cat="منوعات">منوعات</button>
  </nav>

  <section id="adminPanel" class="admin-panel hidden">
    <h2>إضافة خبر جديد</h2>
    <form id="newsForm">
      <input type="text" id="newsTitle" placeholder="عنوان الخبر" required />
      <select id="newsCategory">
        <option value="محلية">محلية</option>
        <option value="عربية">عربية</option>
        <option value="دولية">دولية</option>
        <option value="سياسة">سياسة</option>
        <option value="رياضة">رياضة</option>
        <option value="منوعات">منوعات</option>
      </select>
      <label class="check-row">
        <input type="checkbox" id="isBreaking" /> خبر عاجل
      </label>
      <textarea id="newsBody" rows="3" placeholder="نص الخبر..." required></textarea>
      <button type="submit" class="btn-primary">نشر الخبر</button>
    </form>
  </section>

  <main id="newsFeed" class="news-grid"></main>

  <script type="module" src="script.js"></script>
</body>
</html>
