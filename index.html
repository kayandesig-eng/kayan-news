<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كيان نيوز | KAYAN NEWS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>كيان نيوز</h1>
      <span>KAYAN NEWS</span>
    </div>
    <button id="toggleAdminBtn" class="btn-admin">لوحة الإدارة</button>
  </header>

  <div class="ticker">
    <span class="ticker-badge">عاجل</span>
    <div class="ticker-track">
      <div id="breakingTicker" class="ticker-content">مرحباً بكم في منصة كيان نيوز الإخبارية</div>
    </div>
  </div>

  <nav class="categories" id="categoryNav">
    <button data-cat="الكل" class="active">الكل</button>
    <button data-cat="محلية">محلية</button>
    <button data-cat="عربية">عربية</button>
    <button data-cat="دولية">دولية</button>
    <button data-cat="سياسة">سياسة</button>
    <button data-cat="رياضة">رياضة</button>
    <button data-cat="منوعات">منوعات</button>
  </nav>

  <section id="adminPanel" class="admin-panel hidden">
    <div class="admin-header">
      <h2>لوحة إدارة كيان نيوز</h2>
      <button id="lockAdminBtn" class="btn-secondary" type="button">قفل اللوحة</button>
    </div>

    <form id="newsForm" class="admin-box">
      <h3>نشر خبر يدوي</h3>
      <input type="text" id="newsTitle" placeholder="عنوان الخبر" required />
      <input type="url" id="newsImage" placeholder="رابط صورة الخبر (اختياري)" />
      <select id="newsCategory">
        <option value="محلية">محلية</option>
        <option value="عربية">عربية</option>
        <option value="دولية">دولية</option>
        <option value="سياسة">سياسة</option>
        <option value="رياضة">رياضة</option>
        <option value="منوعات">منوعات</option>
      </select>
      <label class="check-row">
        <input type="checkbox" id="isBreaking" /> تثبيت في شريط العاجل
      </label>
      <textarea id="newsBody" rows="3" placeholder="تفاصيل الخبر..." required></textarea>
      <button type="submit" class="btn-primary">نشر الخبر الآن</button>
    </form>

    <form id="rssForm" class="admin-box">
      <h3>جلب تلقائي من مصدر RSS</h3>
      <input type="url" id="rssUrl" placeholder="أدخل رابط RSS (مثال: https://www.aljazeera.net/aljazeerarss/a7c186be-1baa-4bd4-9d80-a84db769f779/73d0e1b4-532f-45ef-b135-bfdff8b8cab9)" required />
      <select id="rssCategory">
        <option value="عربية">عربية</option>
        <option value="دولية">دولية</option>
        <option value="سياسة">سياسة</option>
        <option value="رياضة">رياضة</option>
        <option value="محلية">محلية</option>
        <option value="منوعات">منوعات</option>
      </select>
      <button type="submit" id="fetchRssBtn" class="btn-rss">سحب ونشر آخر الأخبار</button>
      <small id="rssStatus" class="status-msg"></small>
    </form>
  </section>

  <main id="newsFeed" class="news-grid"></main>

  <footer class="footer">
    <p>© 2026 كيان نيوز | KAYAN NEWS - جميع الحقوق محفوظة</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
